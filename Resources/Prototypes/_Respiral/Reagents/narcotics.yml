          key: Stun
          time: 3
          type: Remove
        - !type:GenericStatusEffect
          key: KnockedDown
          time: 3
          type: Remove
        - !type:GenericStatusEffect
          conditions:
            - !type:ReagentCondition
              reagent: Haloperidol
              max: 0.01
          key: Drowsiness
          time: 10
          type: Remove
        - !type:ResetNarcolepsy
          conditions:
            - !type:ReagentCondition
              reagent: MedievalStaminaPotion
              min: 20


