- type: reagent
  id: MedievalHealingPotion
  name: reagent-name-medieval-healing-potion
  group: Medicine
  desc: reagent-desc-medieval-healing-potion
  flavor: sweet
  color: "#ff9999"
  physicalDesc: reagent-physical-desc-syrupy
  metabolisms:
    Bloodstream:
      effects:
        - !type:HealthChange
          damage:
            types:
              Blunt: -0.67
              Slash: -0.66
              Piercing: -0.67
              Heat: -0.5
              Shock: -0.5
              Cold: -0.5
              Caustic: -0.5
              Asphyxiation: -0.5
              Bloodloss: -0.5
        - !type:HealthChange
          conditions:
            - !type:ReagentCondition
              reagent: MedievalHealingPotion
              min: 15
          damage:
            types:
              Blunt: 0.33
              Slash: 0.34
              Piercing: 0.33
- type: reagent
