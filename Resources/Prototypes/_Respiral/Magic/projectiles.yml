- type: entity
  id: MedievalProjFireBall
  name: огненный шар
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: fireball
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Heat: 20
  - type: Element
    element: MedievalFire

- type: entity
  id: MedievalProjWaterBall
  name: ледяной шар
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: ice
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Cold: 20
  - type: Element
    element: MedievalWater
