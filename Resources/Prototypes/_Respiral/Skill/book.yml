- type: entity
  parent: BaseItem
  id: MedievalSkillBookBase
  suffix: Средневековье
  abstract: true
  name: книга
  components:
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    layers:
    - state: paper
    - state: cover_base
      color: "#332d27"
      map: [ "cover" ]
    - state: decor_wingette
      color: "#453f3a"
      map: [ "decor" ]
    - state: icon_text
      map: [ "icon" ]
    - state: overlay_null
      map: [ "overlay" ]
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    damage:
      types:
        Blunt: 1
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 1
  - type: Wear
  - type: Damageable
    damageModifierSet: MedievalBook
  - type: Injurable
    damageContainer: MedievalInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: AddWearAfterUse
    triggers: [Learn, MeleeHit]
    damage:
      types:
        Slash: 1
  - type: StaticPrice
    price: 500

- type: entity
  parent: MedievalSkillBookBase
  id: MedievalSkillBookLiteracy
  name: обучение грамоте
  components:
  - type: Sprite
    layers:
    - sprite: Objects/Misc/books.rsi
      state: paper
    - sprite: Objects/Misc/books.rsi
      state: cover_base
      color: "#332d27"
      map: [ "cover" ]
    - sprite: Objects/Misc/books.rsi
      state: decor_wingette
      color: "#453f3a"
      map: [ "decor" ]
    - sprite: _Respiral/Objects/Items/books.rsi
      state: book5
      map: [ "icon" ]
    - sprite: Objects/Misc/books.rsi
      state: overlay_null
      map: [ "overlay" ]
  - type: LearnSkillWhenUsing
    duration: 2
    skills:
    - MedievalLiteracy
    points:
      MedievalLiteracy: 0.01
    sound:
      collection: MedievalLearnBook

