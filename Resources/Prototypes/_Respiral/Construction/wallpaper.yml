# Рецепты поклейки обоев. Призрак постройки можно повернуть (R),
# чтобы выбрать сторону стены — направление берётся из спрайта.
- type: construction
  id: MedievalWallpaperRed
  name: обои «бордо»
  description: Тонкие бумажные обои, наклеенные на стену.
  graph: MedievalWallpaper
  startNode: start
  targetNode: red
  category: construction-category-structures
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: true
  icon: { sprite: _Respiral/Structures/Wallpaper/icons.rsi, state: red }

