# Графы крафта перил (grayscale railing.rsi, цвет задаётся материалом)
# Дерево — MedievalBoard, камень — MedievalProcessedStone.

- type: constructionGraph
  id: MedievalRailingWood
  start: start
  graph:
    - node: start
      edges:
        - to: side
          steps:
            - material: MedievalBoard
              amount: 1
              doAfter: 2.0
        - to: corner
          steps:
            - material: MedievalBoard
              amount: 1
              doAfter: 2.0
        - to: corner_small
          steps:
            - material: MedievalBoard
              amount: 1
              doAfter: 2.0
        - to: round
          steps:
            - material: MedievalBoard
              amount: 1
              doAfter: 2.0
    - node: side
      entity: MedievalRailingWoodSide
      edges:
        - to: start
          conditions:
          - !type:MinHealthPercent
            value: 90
          steps:
            - tool: Prying
              doAfter: 2.5
          completed:
            - !type:SpawnPrototype
              prototype: MedievalBoard
              amount: 1
            - !type:DeleteEntity {}
    - node: corner
      entity: MedievalRailingWoodCorner
      edges:
        - to: start
          conditions:
          - !type:MinHealthPercent
            value: 90
          steps:
            - tool: Prying
              doAfter: 2.5
          completed:
            - !type:SpawnPrototype
              prototype: MedievalBoard
              amount: 1
            - !type:DeleteEntity {}
    - node: corner_small
      entity: MedievalRailingWoodCornerSmall
      edges:
        - to: start
          conditions:
          - !type:MinHealthPercent
            value: 90
          steps:
            - tool: Prying
              doAfter: 2.5
          completed:
            - !type:SpawnPrototype
              prototype: MedievalBoard
              amount: 1
            - !type:DeleteEntity {}
    - node: round
      entity: MedievalRailingWoodRound
      edges:
        - to: start
          conditions:
          - !type:MinHealthPercent
            value: 90
          steps:
            - tool: Prying
              doAfter: 2.5
          completed:
            - !type:SpawnPrototype
              prototype: MedievalBoard
              amount: 1
            - !type:DeleteEntity {}

