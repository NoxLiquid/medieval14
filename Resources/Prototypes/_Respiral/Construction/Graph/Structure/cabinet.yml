- type: constructionGraph
  id: MedievalCabinet
  start: start
  graph:
  - node: start
    edges:
    - to: girder
      completed:
        - !type:SnapToGrid
          southRotation: true
      steps:
        - material: MedievalConstructionToolsAmmo
          amount: 1
          doAfter: 1

  - node: girder
    entity: MedievalCabinetGirder
    edges:
    - to: start
      completed:
        - !type:SpawnPrototype
          prototype: MedievalConstructionToolsAmmo
          amount: 1
        - !type:DeleteEntity {}
      conditions:
        - !type:EntityAnchored
          anchored: true
        - !type:MinHealthPercent
          value: 90
      steps:
        - tool: Screwing
          doAfter: 2

    - to: filingCabinet
      conditions:
        - !type:EntityAnchored
          anchored: true
      steps:
        - material: MedievalBoard
          amount: 1
          doAfter: 1

    - to: filingCabinetIron
      conditions:
        - !type:EntityAnchored
          anchored: true
      steps:
        - material: MedievalProcessedIron
          amount: 1
          doAfter: 1

  - node: filingCabinet
    entity: MedievalFilingCabinet

  - node: filingCabinetIron
    entity: MedievalFilingCabinetIron

