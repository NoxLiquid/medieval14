- type: constructionGraph
  id: MedievalBarrel
  start: start
  graph:
  - node: start
    actions:
    - !type:DestroyEntity {}
    edges:
    - to: barrel
      completed:
      - !type:SnapToGrid {}
      steps:
      - material: MedievalConstructionToolsAmmo
        amount: 1
      - tool: Screwing
        doAfter: 2
      - material: MedievalBoard
        amount: 2
        doAfter: 3
      - tool: MedievalScore
        doAfter: 2

  - node: barrel
    entity: MedievalBarrel
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: MedievalBoard1
        amount: 2
      steps:
      - tool: Prying
        doAfter: 3
