# Граф крафта средневекового мусоропровода (без электроники).
# start -> frame (деревянный каркас) -> frame_unit -> disposal_unit.
# Материал — MedievalBoard (обработанное дерево). Этапы с кабелями/электроникой
# из апстрима убраны: средневековый юнит не питается.

- type: constructionGraph
  id: MedievalDisposalMachine
  start: start
  graph:
    - node: start
      edges:
        - to: frame
          steps:
            - material: MedievalBoard
              amount: 2
              doAfter: 2
    - node: frame
      entity: MedievalDisposalMachineFrame
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MedievalBoard
              amount: 2
            - !type:DeleteEntity {}
          steps:
            - tool: Prying
              doAfter: 1
        - to: frame_unit
          steps:
            - tool: Screwing
              doAfter: 0.5
    - node: frame_unit
      entity: MedievalDisposalMachineFrame
      actions:
        - !type:AppearanceChange
      edges:
        - to: frame
          steps:
            - tool: Prying
              doAfter: 0.5
        - to: disposal_unit
          conditions:
            - !type:EntityAnchored
          steps:
            - material: MedievalBoard
              amount: 1
              doAfter: 2
    - node: disposal_unit
      entity: MedievalDisposalUnit
      edges:
        - to: frame_unit
          completed:
            - !type:SpawnPrototype
              prototype: MedievalBoard
              amount: 1
            - !type:EmptyAllContainers
          conditions:
            - !type:EntityAnchored
          steps:
            - tool: Prying
              doAfter: 1
