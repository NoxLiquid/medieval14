- type: constructionGraph
  id: MedievalTable
  start: start
  graph:
    - node: start
      edges:
        - to: MedievalTableWoodFrame
          completed:
            - !type:SnapToGrid 
              southRotation: true
          steps:
            - material: MedievalConstructionToolsAmmo
              amount: 1
              doAfter: 1
    
    - node: MedievalTableWoodFrame
      entity: MedievalTableWoodFrame
      edges:
        - to: start
          conditions:
            - !type:MinHealth
              threshold: 250
          completed:
            - !type:SpawnPrototype
              prototype: MedievalConstructionToolsAmmo
              amount: 1
            - !type:DeleteEntity {}
          steps:
            - tool: Anchoring
              doAfter: 1  
        - to: MedievalCounterWood
          conditions:
            - !type:MinHealth
              threshold: 250
          steps:
            - tool: MedievalScore
              doAfter: 1
            - tool: MedievalScore
              doAfter: 1
            - material: MedievalBoard
              amount: 1
              doAfter: 1
        - to: MedievalTableWood
          conditions:
            - !type:MinHealth
              threshold: 250
          steps:
            - tool: MedievalScore
              doAfter: 1
            - material: MedievalBoard
              amount: 1
              doAfter: 1

    - node: MedievalCounterWood
      entity: MedievalCounterWood
      edges:
        - to: MedievalTableWoodFrame
          conditions:
            - !type:MinHealth
              threshold: 250
          completed:
            - !type:SpawnPrototype
              prototype: MedievalBoard
              amount: 1
          steps:
            - tool: Prying
              doAfter: 1

    - node: MedievalTableWood
      entity: MedievalTableWood
      edges:
        - to: MedievalTableWoodFrame  
          conditions:
            - !type:MinHealth
              threshold: 250
          completed:
            - !type:SpawnPrototype
              prototype: MedievalBoard
              amount: 1
          steps:
            - tool: Prying
              doAfter: 2