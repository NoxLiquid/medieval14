# Рецепт постройки средневекового мусоропровода.
# Имя/иконка берутся из целевой сущности MedievalDisposalUnit.

- type: construction
  id: MedievalDisposalUnit
  graph: MedievalDisposalMachine
  startNode: start
  targetNode: disposal_unit
  category: construction-category-utilities
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  conditions:
  - !type:TileNotBlocked

# --- Трубы мусоропровода ---
# Без TileNotBlocked: трубы — subfloor-сегменты, строятся на голой решётке
# (MedievalLattice/MedievalDirt) и уходят под настоящий пол.

