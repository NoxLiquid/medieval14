      limit: 0
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceMedievalHuman
  name: medieval human appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganMedievalHumanTorso
      Head: OrganMedievalHumanHead
      ArmLeft: OrganMedievalHumanArmLeft
      ArmRight: OrganMedievalHumanArmRight
      HandRight: OrganMedievalHumanHandRight
      HandLeft: OrganMedievalHumanHandLeft
      LegLeft: OrganMedievalHumanLegLeft
      LegRight: OrganMedievalHumanLegRight
      FootLeft: OrganMedievalHumanFootLeft
      FootRight: OrganMedievalHumanFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: MedievalHuman

- type: entity
  parent: BaseSpeciesMobOrganic
  id: MedievalBaseSpeciesMobOrganic
  components:
  - type: Mana

- type: entity
  parent:
  - AppearanceMedievalHuman
  - MedievalBaseSpeciesMobOrganic
  id: MedievalMobHuman
  name: человек
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5

- type: entity
  parent: OrganHuman
  id: OrganMedievalHuman
  abstract: true
  suffix: medieval human

- type: entity
  parent: OrganMedievalHuman
  id: OrganMedievalHumanExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Respiral/Mobs/Species/Human/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Respiral/Mobs/Species/Human/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: MedievalHuman

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganMedievalHumanExternal ]
  id: OrganMedievalHumanTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganMedievalHumanExternal ]
