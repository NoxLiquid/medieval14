- type: entity
  parent: [ BaseStructureDynamic, BaseBagOpenClose, MedievalWoodenFurnitureBase ]
  id: MedievalBaseFilingCabinet
  name: Шкаф
  description: Шкаф для хранения всех ваших предметов.
  suffix: Средневековье, пустой
  abstract: true
  components:
  - type: MedievalPhysicalPriced
  - type: Storage
    grid:
    - 0,0,9,3
    maxItemSize: Normal
  - type: Sprite
    sprite: _Respiral/Structures/Storages/cabinets.rsi
    noRot: true
  - type: Appearance
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.18,-0.48,0.18,0.48"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: InteractionOutline
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: MedievalBaseFilingCabinet
  id: MedievalFilingCabinet
  name: деревянный шкаф
  description: Деревянный шкаф для хранения вещей.
  components:
  - type: Sprite
    sprite: _Respiral/Structures/Storages/wood_cabinet.rsi
    state: icon
    layers:
    - state: icon
    - state: icon-open
      map: ["openLayer"]
  - type: Icon
    sprite: _Respiral/Structures/Storages/wood_cabinet.rsi
    state: icon
  - type: PhysicalComposition # нужно rcd 1
    materialComposition:
      MedievalProcessedWood: 100
      MedievalProcessedStone: 6
      MedievalProcessedIron: 3
  - type: Construction
    graph: MedievalCabinet
    node: filingCabinet

- type: entity
  parent: MedievalBaseFilingCabinet
  id: MedievalFilingCabinetIron
  name: железный шкаф
  description: Прочный железный шкаф для хранения вещей.
  components:
  - type: Sprite
    sprite: _Respiral/Structures/Storages/iron_cabinet.rsi
    state: icon
    layers:
    - state: icon
    - state: icon-open
      map: ["openLayer"]
  - type: Icon
    sprite: _Respiral/Structures/Storages/iron_cabinet.rsi
    state: icon
  - type: Damageable
    damageModifierSet: MedievalIron
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: PhysicalComposition # нужно rcd 1
    materialComposition:
      MedievalProcessedWood: 20
      MedievalProcessedStone: 6
      MedievalProcessedIron: 100
  - type: Construction
    graph: MedievalCabinet
    node: filingCabinetIron
