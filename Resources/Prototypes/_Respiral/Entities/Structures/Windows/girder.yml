- type: entity
  id: MedievalBaseWindowFrame
  abstract: true
  parent: BaseStructureDynamic
  suffix: Средневековье
  description: Каркас, в который можно вставить стекло.
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb {}
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Tag
    tags:
    - ForceFixRotations
    - Window
  - type: InteractionOutline
  - type: SpriteFade
  - type: Sprite
    drawdepth: Mobs
  - type: Icon
    state: full

- type: entity
  id: MedievalBaseWoodenWindowFrame
  abstract: true
  parent: MedievalBaseWindowFrame
  components:
  - type: Damageable
    damageModifierSet: MedievalWood
  - type: Injurable
    damageContainer: MedievalInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy

- type: entity
  id: MedievalBaseStoneWindowFrame
  abstract: true
  parent: MedievalBaseWindowFrame
  components:
  - type: Damageable
    damageModifierSet: MedievalStone
  - type: Injurable
    damageContainer: MedievalInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 180
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6

- type: entity
  id: MedievalWindowWoodenFrame
  parent: MedievalBaseWoodenWindowFrame
  name: каркас деревянного окна
  components:
  - type: Construction
    graph: MedievalWindow
    node: woodenWindowFrame
  - type: Sprite
    sprite: _Respiral/Structures/Windows/wooden_window_frame.rsi
  - type: Icon
    sprite: _Respiral/Structures/Windows/wooden_window_frame.rsi
    state: full
  - type: IconSmooth
    key: woods
    base: window

