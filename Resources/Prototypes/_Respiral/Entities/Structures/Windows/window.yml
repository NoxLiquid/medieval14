- type: entity
  id: MedievalBaseWindow
  abstract: true
  parent: [BaseDeltaPressureGlass, BaseStructure]
  suffix: Средневековье
  description: Не пачкайте стекло.
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmack
  - type: WallMount
    arc: 360
  - type: Tag
    tags:
    - ForceFixRotations
    - Window
    - MedievalWall
  - type: Sprite
    drawdepth: Mobs
  - type: SpriteFade
  - type: Icon
    state: full
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb {}
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Glass
  - type: ExaminableDamage
    messages: WindowMessages
  - type: Repairable
  - type: Airtight
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 2
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: InteractionPopup
    interactSuccessString: comp-window-knock
    messagePerceivedByOthers: comp-window-knock
    interactSuccessSound:
      path: /Audio/Effects/glass_knock.ogg
  - type: BlockWeather

- type: entity
  id: MedievalBaseWindowBroken
  abstract: true
  parent: BaseStructure
  suffix: Средневековье
  description: Остатки разбитого окна.
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: WallMount
    arc: 360
  - type: Tag
    tags:
    - ForceFixRotations
    - Window
    - MedievalWall
  - type: Sprite
    drawdepth: Mobs
  - type: SpriteFade
  - type: Icon
    state: full
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb {}
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: ExaminableDamage
    messages: WindowMessages
  - type: Repairable
  - type: Appearance

- type: entity
  id: MedievalBaseWoodenBrokenWindow
  abstract: true
  parent: MedievalBaseWindowBroken
  components:
  - type: Damageable
    damageContainer: MedievalInorganic
    damageModifierSet: MedievalWood

- type: entity
  id: MedievalBaseStoneBrokenWindow
  abstract: true
  parent: MedievalBaseWindowBroken
  components:
  - type: Damageable
    damageContainer: MedievalInorganic
    damageModifierSet: MedievalStone

- type: entity
  id: MedievalWindowWooden
  parent: MedievalBaseWindow
  name: деревянное окно
  components:
  - type: Sprite
    sprite: _Respiral/Structures/Windows/wooden_window.rsi
  - type: Icon
    sprite: _Respiral/Structures/Windows/wooden_window.rsi
    state: full
  - type: IconSmooth
    key: woods
    base: window
  - type: Construction
    graph: MedievalWindow
    node: woodenWindow
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:ChangeConstructionNodeBehavior
        node: woodenWindowBroken
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: MedievalWindowWoodenBroken
  parent: MedievalBaseWoodenBrokenWindow
  name: разбитое деревянное окно
  components:
  - type: Sprite
    sprite: _Respiral/Structures/Windows/wooden_window_broken.rsi
  - type: Icon
    sprite: _Respiral/Structures/Windows/wooden_window_broken.rsi
    state: full
  - type: IconSmooth
    key: woods
    base: window
  - type: Construction
    graph: MedievalWindow
    node: woodenWindowBroken
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:ChangeConstructionNodeBehavior
        node: woodenWindowFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]

