  description: Небольшой костёр из деревянных жердей. Когда топливо прогорает, он не исчезает и ждёт, пока в него добавят ещё угля.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 30
        mask:
        - TableMask
  - type: Sprite
    sprite: _Respiral/Structures/Light/bonfire.rsi
    layers:
    - map: [ enum.ExpendableLightVisualLayers.Base ]
      state: off
    - map: [ enum.ExpendableLightVisualLayers.Glow ]
      state: fire_on
      visible: false
      shader: unshaded
  - type: ExpendableLight
    refuelMaterialID: MedievalRawCoal
    glowDuration: 800
    refuelMaterialTime: 800
    refuelMaximumDuration: 805
  - type: PointLight
    enabled: false
    netsync: false
    color: "#FFC90C"
    radius: 3.8
    energy: 4.6
  - type: Damageable
    damageModifierSet: MedievalWood
  - type: Injurable
    damageContainer: MedievalInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedWood: 200
      MedievalRawCoal: 25
  - type: Construction
    graph: MedievalBonfire
    node: bonfire

