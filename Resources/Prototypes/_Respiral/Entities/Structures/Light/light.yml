- type: entity
  id: MedievalBaseExpendableLightStructure
  abstract: true
  parent: BaseStructure
  suffix: Средневековье
  components:
  - type: MedievalPhysicalPriced
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 30
        mask:
        - TableMask
  - type: InteractionOutline
  - type: Sprite
    noRot: true
  - type: Appearance
  - type: ExpendableLight
    glowDuration: 1200
    refuelMaterialTime: 1200
    refuelMaximumDuration: 1205
    fadeOutDuration: 4
    turnOnBehaviourID: turn_on
    fadeOutBehaviourID: fade_out
    litSound:
      path: /Audio/Items/Flare/flare_on.ogg
    loopedSound:
      path: /Audio/Ambience/Objects/fireplace.ogg
    dieSound:
      path: /Audio/Items/candle_blowing.ogg
  - type: PointLight
    enabled: false
    netsync: false
    color: "#E25822"
    radius: 2.5
    energy: 3.0
  - type: IgnitionSource
    temperature: 700
    ignited: false
  - type: IgniteExpendableLightOnHotInteract
  - type: LightBehaviour
    behaviours:
      - !type:RandomizeBehaviour
        id: turn_on
        interpolate: Nearest
        minDuration: 0.02
        maxDuration: 0.06
        startValue: 2.4
        endValue: 3.8
        property: Energy
        isLooped: true
      - !type:FadeBehaviour
        id: turn_on
        maxDuration: 4.0
        startValue: 1.0
        endValue: 3.0
      - !type:RandomizeBehaviour
        id: fade_out
        interpolate: Nearest
        minDuration: 0.02
        maxDuration: 0.06
        startValue: 1.5
        endValue: 3.0
        property: Energy
        isLooped: true
      - !type:FadeBehaviour
        id: fade_out
        maxDuration: 4.0
        startValue: 3.0
        endValue: 0.8

- type: entity
  id: MedievalStandingTorch
  parent: MedievalBaseExpendableLightStructure
  name: напольный железный факел
  description: Железный факел на длинной ножке. Его можно зажечь вручную или от другого источника огня, а когда топливо прогорит — зарядить углём.
  components:
  - type: Sprite
    sprite: _Respiral/Structures/Light/torch.rsi
    layers:
    - map: [ enum.ExpendableLightVisualLayers.Base ]
      state: off
    - map: [ enum.ExpendableLightVisualLayers.Glow ]
      state: fire_on
      visible: false
      shader: unshaded
  - type: ExpendableLight
    refuelMaterialID: MedievalRawCoal
    glowDuration: 1200
    refuelMaterialTime: 1200
    refuelMaximumDuration: 1205
  - type: PointLight
    enabled: false
    netsync: false
    color: "#F5C16C"
    radius: 2.2
    energy: 2.8
  - type: Damageable
    damageModifierSet: MedievalIron
  - type: Injurable
    damageContainer: MedievalInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedIron: 100
      MedievalRawCoal: 25
  - type: Construction
    graph: MedievalStandingTorch
    node: torch

- type: entity
  id: MedievalStandingManaTorch
