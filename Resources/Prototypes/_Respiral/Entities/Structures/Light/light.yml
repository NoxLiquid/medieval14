      state: off
    - map: [ enum.ExpendableLightVisualLayers.Glow ]
      state: mana_fire_on
      visible: false
      shader: unshaded
  - type: ExpendableLight
    refuelMaterialID: MedievalManaCrystal
    glowDuration: 3600
    refuelMaterialTime: 3600
    refuelMaximumDuration: 3605
  - type: PointLight
    enabled: false
    netsync: false
    color: "#47F8FF"
    radius: 2.6
    energy: 3.2
  - type: Damageable
    damageModifierSet: MedievalIron
  - type: Injurable
    damageContainer: MedievalInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedIron: 100
      MedievalRawManaCrystal: 25
  - type: Construction
    graph: MedievalStandingManaTorch
    node: torch

- type: entity
