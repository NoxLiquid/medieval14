- type: entity
  parent: MedievalBaseWall
  id: MedievalNaturalWallBase
  abstract: true
  suffix: Средневековье
  components:
  - type: IconSmooth
    key: walls
    base: wall

- type: entity
  parent: MedievalNaturalWallBase
  id: MedievalNaturalMineWallBase
  abstract: true
  components:
  - type: SoundOnGather
  - type: Gatherable
    toolWhitelist:
      tags:
      - Pickaxe
  - type: MiningScannerViewable

- type: entity
  parent: MedievalNaturalMineWallBase
  id: MedievalWallCaveStone
  name: каменная пещерная стена
  description: Плотная природная каменная порода.
  components:
  - type: Sprite
    sprite: _Respiral/Structures/Walls/Natural/cave_stone.rsi
  - type: Icon
    sprite: _Respiral/Structures/Walls/Natural/cave_stone.rsi
  - type: Damageable
    damageContainer: MedievalInorganic
    damageModifierSet: MedievalStone
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:SpawnEntitiesBehavior
        offset: 0.5
        spawn:
          MedievalStoneOre:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6

- type: entity
  parent: MedievalNaturalMineWallBase
  id: MedievalWallCaveStoneStrong
  name: укреплённая каменная пещерная стена
  description: Более прочная природная каменная порода.
