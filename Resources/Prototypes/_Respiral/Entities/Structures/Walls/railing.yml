      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,-0.35"
        density: 1000
        mask:
        - TableMask
        layer:
        - MidImpassable
        - LowImpassable
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,-0.35,0.5"
        density: 1000
        mask:
        - TableMask
        layer:
        - MidImpassable
        - LowImpassable

