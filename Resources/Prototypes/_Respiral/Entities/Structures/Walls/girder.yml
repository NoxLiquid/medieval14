- type: entity
  id: MedievalBaseWallFrame
  abstract: true
  suffix: Средневековье
  parent: BaseStructureDynamic
  name: каркас стены
  components:
  - type: Transform
    anchored: true
    noRot: false
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - GlassAirlockLayer
  - type: InteractionOutline
  - type: Sprite
    noRot: true
  - type: Icon
    state: frame

- type: entity
  id: MedievalBaseWoodWallFrame
  abstract: true
  parent: MedievalBaseWallFrame
  components:
  - type: Damageable
    damageContainer: MedievalInorganic
    damageModifierSet: MedievalWood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy

- type: entity
  id: MedievalBaseStoneWallFrame
  abstract: true
  parent: MedievalBaseWallFrame
  components:
  - type: Damageable
    damageContainer: MedievalInorganic
    damageModifierSet: MedievalStone
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 350
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6

- type: entity
  id: MedievalWallWoodenFrame
  parent: MedievalBaseWoodWallFrame
  name: каркас деревянной стены
  components:
  - type: Construction
    graph: MedievalWall
    node: woodenWallFrame
  - type: Sprite
    sprite: _Respiral/Structures/Walls/wooden_wall.rsi
    state: frame
  - type: Icon
    sprite: _Respiral/Structures/Walls/wooden_wall.rsi

