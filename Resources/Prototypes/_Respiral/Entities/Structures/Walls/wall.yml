- type: entity
  parent: MedievalBaseWoodWall
  id: MedievalWallWoodenPalisad
  suffix: Средневековье
  name: деревянная палисада
  description: Грубое защитное сооружение из кольев и досок.
  components:
  - type: Sprite
    sprite: _Respiral/Structures/Walls/wooden_palisad.rsi
  - type: Icon
    sprite: _Respiral/Structures/Walls/wooden_palisad.rsi
  - type: Construction
    graph: MedievalWall
    node: woodenPalisadWall
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger # если вдруг урона будет много, то палисад развалится полностью
        damage: 1800
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
    - trigger:
        !type:DamageTrigger
        damage: 900
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:ChangeConstructionNodeBehavior
        node: woodenPalisadWallFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: MedievalWoodenSupportWallBroken
  parent: MedievalWoodenSupportWall
  name: поломанная деревянная опорная стена
  components:
