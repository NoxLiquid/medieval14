- type: entity
  parent: MedievalBaseStructureWall
  id: MedievalBaseWall
  abstract: true
  components:
  - type: Occluder
  - type: Sprite
    drawdepth: OverMobs
  - type: SpriteFade
  - type: Tag
    tags:
    - MedievalWall

- type: entity
  parent: MedievalBaseWall
  id: MedievalBaseStoneWall
  abstract: true
  components:
  - type: Damageable
    damageContainer: MedievalInorganic
    damageModifierSet: MedievalStone
  - type: IconSmooth
    key: walls
    base: stonebricks

- type: entity
  parent: MedievalBaseWall
  id: MedievalBaseWoodWall
  abstract: true
  components:
  - type: Damageable
    damageContainer: MedievalInorganic
    damageModifierSet: MedievalWood
  - type: IconSmooth
    key: woods
    base: wood

- type: entity
  abstract: true
  parent: BaseStructure
  id: MedievalBaseStructureWall
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MetalBulletImpact
    soundTypes:
      Heat:
        collection:
          MetalLaserImpact
  - type: Tag
    tags:
    - Wall
  - type: IsRoof
  - type: Sprite
    drawdepth: Walls
  - type: Icon
    state: full
  - type: PlacementReplacement
    key: walls
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: Airtight
  - type: RadiationBlocker
    resistance: 2
  - type: BlockWeather
  - type: SunShadowCast

- type: entity
  parent: MedievalBaseWoodWall
  id: MedievalWallWooden
  suffix: Средневековье
  name: деревянная стена
  description: Традиционное защитное сооружение.
  components:
  - type: Sprite
    sprite: _Respiral/Structures/Walls/wooden_wall.rsi
  - type: Icon
    sprite: _Respiral/Structures/Walls/wooden_wall.rsi
  - type: Construction
    graph: MedievalWall
    node: woodenWall
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 2000
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:ChangeConstructionNodeBehavior
        node: woodenWallFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]

