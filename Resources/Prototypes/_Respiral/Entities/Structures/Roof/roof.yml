- type: entity
  parent: MedievalBaseRoof
  id: MedievalRoofStone
  name: каменная крыша
  description: Прочная каменная крыша, надёжно защищающая от непогоды.
  components:
  - type: Sprite
    sprite: _Respiral/Structures/Roof/stone.rsi
  - type: Icon
    sprite: _Respiral/Structures/Roof/stone.rsi
    state: full
  - type: Damageable
    damageModifierSet: MedievalStone
  - type: Injurable
    damageContainer: MedievalInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          MedievalProcessedStone:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: MedievalRoof
    node: stone
