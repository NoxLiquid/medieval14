- type: entity
  parent: BaseStructureDynamic
  id: MedievalCart
  name: повозка
  description: Деревянная повозка на колёсах. Слишком тяжела, чтобы человек мог легко сдвинуть её с места в одиночку.
  placement:
    mode: PlaceFree
  components:
  - type: MedievalPhysicalPriced
  - type: Hitch
  - type: Physics
    bodyType: Dynamic
    fixedRotation: true
  - type: Sprite
    sprite: _Respiral/Structures/cart.rsi
    layers:
    - state: cart_empty
      map: ["base"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-0.5,0.6,0.8"
        density: 900
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: EntityStorage
    capacity: 60
    airtight: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.HasContents:
        base:
          True: { state: cart }
          False: { state: cart_empty }
  - type: Damageable
    damageModifierSet: MedievalWood
  - type: Injurable
    damageContainer: MedievalInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
