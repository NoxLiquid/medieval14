- type: entity
  id: MedievalCarpetBase
  parent: BaseStructure
  name: ковёр
  description: Мягкое тканое покрытие для пола.
  abstract: true
  components:
  - type: Sprite
    drawdepth: FloorTiles
  - type: Icon
    state: full
  - type: IconSmooth
    key: full
    base: carpet_
  - type: Tag
    tags:
    - Carpet
    - ForceFixRotations
  - type: Clickable
  - type: Physics
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 5
        layer:
        - DoorPassable
  - type: Damageable
    damageModifierSet: MedievalFlax
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          MedievalCloth1:
            min: 1
            max: 1
  - type: Butcherable
    butcherDelay: 2
    spawned:
    - id: MedievalCloth1
      amount: 1
  - type: TrayScanReveal

- type: entity
  id: MedievalCarpetRed
  parent: MedievalCarpetBase
  name: красный ковёр
  components:
  - type: Sprite
    sprite: _Respiral/Structures/Furniture/Carpets/red_carpet.rsi
  - type: Icon
    sprite: _Respiral/Structures/Furniture/Carpets/red_carpet.rsi

