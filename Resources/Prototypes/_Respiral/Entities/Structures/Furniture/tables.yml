- type: entity
  id: MedievalTableWoodFrame
  parent: 
  - BaseStructure
  - MedievalWoodenFurnitureBase
  name: Деревянный каркас стола 
  components:
  - type: SpriteFade
  - type: Sprite
    sprite: Structures/Furniture/Tables/frame.rsi
  - type: Icon
    sprite: Structures/Furniture/Tables/frame.rsi
    state: full
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: IconSmooth
    key: state
    base: state_
  - type: Construction
    graph: MedievalTable
    node: MedievalTableWoodFrame
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedWood: 3
      MedievalProcessedStone: 6
      MedievalProcessedIron: 3

