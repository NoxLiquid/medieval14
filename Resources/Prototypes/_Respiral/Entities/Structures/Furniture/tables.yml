- type: entity
  id: MedievalTableMarble
  parent: TableBase
  name: мраморный стол
  description: Тяжёлый каменный стол с мраморной столешницей.
  components:
  - type: MedievalPhysicalPriced
  - type: Damageable
    damageContainer: MedievalInorganic
    damageModifierSet: MedievalStone
  - type: Sprite
    sprite: _Respiral/Structures/Furniture/Tables/marble.rsi
  - type: Icon
    sprite: _Respiral/Structures/Furniture/Tables/marble.rsi
    state: full
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: marbletable
    base: state
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepTile
  - type: Construction
    graph: MedievalTable
    node: MedievalTableMarble
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedWood: 3
      MedievalProcessedStone: 100
      MedievalProcessedIron: 3