- type: entity
  id: MedievalCurtains
  parent: BaseCurtains
  name: шторы
  description: Плотные шторы, скрывающие происходящее за ними.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Respiral/Structures/Furniture/curtains.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Construction
    graph: MedievalCurtains
    node: curtains
  - type: Occluder
    boundingBox: "-0.5,0.4,0.5,1.2"

- type: entity
  id: MedievalCurtainsOpen
  parent: MedievalCurtains
  suffix: Open
  components:
  - type: Sprite
    sprite: _Respiral/Structures/Furniture/curtains.rsi
    layers:
    - state: open
      map: ["enum.DoorVisualLayers.Base"]
  - type: Door
    state: Open
  - type: Occluder
    enabled: false
  - type: Construction
    graph: MedievalCurtains
    node: curtainsOpen
  - type: Physics
    canCollide: false

