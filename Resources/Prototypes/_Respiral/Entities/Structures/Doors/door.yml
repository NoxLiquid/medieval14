- type: entity
  id: MedievalWoodenDoor
  name: деревянная дверь
  parent: MedievalBaseInstantDoor
  components:
  - type: Construction
    graph: MedievalDoor
    node: woodenDoor
  - type: Sprite
    sprite: _Respiral/Structures/Doors/wooden_door.rsi
  - type: Icon
    sprite: _Respiral/Structures/Doors/wooden_door.rsi
    state: closed
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:ChangeConstructionNodeBehavior
        node: woodenDoorFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]

