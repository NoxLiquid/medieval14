- type: entity
  id: MedievalBaseInstantDoor
  abstract: true
  parent: MedievalBaseLockableDoor
  components:
  - type: Door
    openDrawDepth: Mobs
    closedDrawDepth: Mobs
    closeTimeOne: 0
    closeTimeTwo: 0
    openTimeOne: 0
    openTimeTwo: 0
    openingAnimationTime: 0
    closingAnimationTime: 0
  - type: Occluder
    boundingBox: "-0.5,-0.25,0.5,0.5"

- type: entity
  id: MedievalBaseIronInstantDoor
  abstract: true
  parent: MedievalBaseInstantDoor
  components:
  - type: Damageable
    damageContainer: MedievalInorganic
    damageModifierSet: MedievalIron
  - type: Door
    openDrawDepth: Mobs
    closedDrawDepth: Mobs
    openSound:
      path: /Audio/Effects/stonedoor_openclose.ogg
    closeSound:
      path: /Audio/Effects/stonedoor_openclose.ogg

- type: entity
  id: MedievalBaseWindowedDoor
  abstract: true
  components:
  - type: Door
    occludes: false
    changeAirtight: false
  - type: Occluder
    enabled: false

- type: entity
  id: MedievalBaseDoorFrame
  abstract: true
  parent: BaseStructure
  suffix: Средневековье
  description: Каркас двери, который можно восстановить.
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: Mobs
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 80
        mask:
        - FullTileMask
        layer:
        - AirlockLayer

- type: entity
  id: MedievalBaseWoodenDoorFrame
  abstract: true
  parent: MedievalBaseDoorFrame
  components:
  - type: Damageable
    damageContainer: MedievalInorganic
    damageModifierSet: MedievalWood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: MedievalBaseIronDoorFrame
  abstract: true
  parent: MedievalBaseDoorFrame
  components:
  - type: Damageable
    damageContainer: MedievalInorganic
    damageModifierSet: MedievalIron
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: MedievalWoodenDoorFrame
  name: каркас деревянной двери
  parent: MedievalBaseWoodenDoorFrame
  components:
  - type: Construction
    graph: MedievalDoor
    node: woodenDoorFrame
  - type: Sprite
    sprite: _Respiral/Structures/Doors/wooden_frame.rsi
    state: closed
  - type: Icon
    sprite: _Respiral/Structures/Doors/wooden_frame.rsi
    state: closed

- type: entity
  id: MedievalWoodenBirchDoorFrame
  name: каркас берёзовой двери
