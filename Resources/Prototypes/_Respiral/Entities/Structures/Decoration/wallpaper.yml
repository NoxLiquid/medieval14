- type: entity
  id: MedievalWallpaperBase
  parent: BaseStructure
  name: обои
  description: Тонкие бумажные обои, наклеенные на стену.
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: SpriteFade
  - type: Sprite
    drawdepth: Walls
    layers:
    - state: bottom
    - state: top
    - state: left
    - state: right
  - type: Icon
    state: bottom
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    canCollide: false
  - type: Damageable
    damageModifierSet: MedievalFlax
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: TrayScanReveal

- type: entity
  id: MedievalWallpaperRed
  parent: MedievalWallpaperBase
  name: обои «бордо»
  components:
  - type: Sprite
    sprite: _Respiral/Structures/Wallpaper/wallpaper_red.rsi
  - type: Icon
    sprite: _Respiral/Structures/Wallpaper/wallpaper_red.rsi
  - type: Construction
    graph: MedievalWallpaper
    node: red

