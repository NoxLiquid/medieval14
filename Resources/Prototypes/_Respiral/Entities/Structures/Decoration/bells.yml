# Колокола
- type: entity
  id: MedievalGuardBell1
  name: сторожевой колокол
  description: Железный колокол на деревянной стойке. Используется для оповещения.
  parent: BaseStructureDynamic
  components:
  - type: Sprite
    sprite: _Respiral/Structures/guard_bell.rsi
    state: base
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 400
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: InteractionOutline
  - type: InteractionPopup
    interactDelay: 1
    successChance: 1
    interactSuccessSound:
      collection: ChurchBell
  - type: Physics
  - type: Damageable
    damageContainer: MedievalInorganic
    damageModifierSet: MedievalWood
  - type: Construction
    graph: MedievalGuardBell
    node: bell1
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          MedievalIronIngot1:
            min: 1
            max: 1
          MedievalBoard1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedIron: 100
      MedievalProcessedWood: 200

