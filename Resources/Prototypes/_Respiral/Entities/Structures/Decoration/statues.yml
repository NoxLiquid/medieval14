# Статуи ангелов
- type: entity
  id: MedievalAngelStatue1
  name: статуя ангела
  description: Величественная каменная статуя ангела с расправленными крыльями.
  parent: BaseStructureDynamic
  components:
  - type: Sprite
    sprite: _Respiral/Structures/Decoration/angel_statue.rsi
    noRot: true
    layers:
    - state: statue1
    - state: glow
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.0, -0.5, 1.0, 0.5"
        density: 500
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: InteractionOutline
  - type: Physics
  - type: Damageable
    damageModifierSet: MedievalStone
  - type: Injurable
    damageContainer: MedievalInorganic
  - type: Construction
    graph: MedievalStatue
    node: angelStatue1
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          MedievalProcessedStone1:
            min: 2
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedStone: 300

