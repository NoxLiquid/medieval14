- type: entity
  parent: MedievalBaseEveningstar
  id: MedievalIronEveningstar
  name: железный моргенштерн
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Items/Weapon/two_eveningstar.rsi
    layers:
    - state: blade
      map: [ base ]
    - state: handle
      map: [ handle ]
  - type: MaterialColorVisuals
    layers:
      base: MedievalProcessedIron
    inhand: MedievalProcessedIron
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 3.67
        Slash: 3.66
        Piercing: 3.67
  - type: MedievalWeaponDamage
    baseDamage:
      types:
        Blunt: 3.67
        Slash: 3.66
        Piercing: 3.67
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 7.33
        Slash: 7.34
        Piercing: 7.33
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedIron: 150
      MedievalProcessedWood: 100
  - type: AddWearAfterUse
    triggers: [MeleeHit, Interact]
    damage:
      types:
        Structural: 5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

