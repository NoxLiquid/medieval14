- type: entity
  parent: MedievalBaseEveningstar
  id: MedievalIronEveningstar
  name: железный моргенштерн
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Items/Weapon/two_eveningstar.rsi
    layers:
    - state: blade
      color: "#8A8A8A"
      map: [ blade ]
    - state: handle
      map: [ handle ]
  - type: MeleeWeapon
    damage:
      groups:
        Brute: 11
  - type: IncreaseDamageOnWield
    damage:
      groups:
        Brute: 22
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#8A8A8A"
      right:
      - state: inhand-right
        color: "#8A8A8A"
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedIron: 150
      MedievalProcessedWood: 100
  - type: AddWearAfterUse
    triggers: [MeleeHit, Interact]
    damage:
      types:
        Structural: 5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

