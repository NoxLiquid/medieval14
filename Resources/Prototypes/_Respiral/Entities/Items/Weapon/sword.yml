- type: entity
  parent: MedievalBaseSword
  id: MedievalIronSword
  name: железный меч
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Items/Weapon/sword1.rsi
    layers:
    - state: blade
      map: [ blade ]
    - state: handle
  - type: MaterialColorVisuals
    layers:
      blade: MedievalProcessedIron
    inhand: MedievalProcessedIron
  - type: MeleeWeapon
    damage:
      types:
        Slash: 15
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedIron: 200
      MedievalProcessedWood: 100
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

