- type: entity
  parent: MedievalBaseDagger
  id: MedievalIronDagger
  name: железный кинжал
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Items/Weapon/dagger.rsi
    layers:
    - state: blade
      map: [ blade ]
    - state: handle
  - type: MaterialColorVisuals
    layers:
      blade: MedievalProcessedIron
    inhand: MedievalProcessedIron
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 8
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedIron: 100
      MedievalProcessedWood: 50
  - type: AddWearAfterUse
    triggers: [MeleeHit, Interact]
    damage:
      types:
        Structural: 5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

