- type: entity
  parent: MedievalBaseDagger
  id: MedievalIronHideDagger
  name: железный скрытый клинок
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Items/Weapon/hide_dagger.rsi
    layers:
    - state: blade
      map: [ blade ]
    - state: handle
  - type: MaterialColorVisuals
    layers:
      blade: MedievalProcessedIron
    inhand: MedievalProcessedIron
  - type: MeleeWeapon
    attackRate: 2
    angle: 0
    range: 1.5
    damage:
      types:
        Piercing: 6
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedIron: 50
      MedievalProcessedWood: 50
  - type: AddWearAfterUse
    triggers: [MeleeHit, Interact]
    damage:
      types:
        Structural: 5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

