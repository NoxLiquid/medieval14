- type: entity
  parent: MedievalBaseHalberd
  id: MedievalIronHalberd
  name: железная алебарда
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Items/Weapon/two_halberd.rsi
    layers:
    - state: blade
      map: [ base ]
    - state: handle
      map: [ handle ]
  - type: MaterialColorVisuals
    layers:
      base: MedievalProcessedIron
    inhand: MedievalProcessedIron
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 4.17
        Slash: 4.16
        Piercing: 4.17
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 8.33
        Slash: 8.34
        Piercing: 8.33
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedIron: 100
      MedievalProcessedWood: 200
  - type: AddWearAfterUse
    triggers: [MeleeHit, Interact]
    damage:
      types:
        Structural: 5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

