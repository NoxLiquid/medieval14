- type: entity
  parent: MedievalBaseWhip
  id: MedievalIronWhip
  name: железная плеть
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Items/Weapon/whip3.rsi
    layers:
    - state: blade
      map: [ blade ]
    - state: handle
  - type: MaterialColorVisuals
    layers:
      blade: MedievalProcessedIron
    inhand: MedievalProcessedIron
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedIron: 200
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

