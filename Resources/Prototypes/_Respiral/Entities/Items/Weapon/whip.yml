- type: entity
  parent: MedievalBaseWhip
  id: MedievalPeltWhip
  name: кожанная плеть
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Items/Weapon/whip.rsi
    layers:
    - state: icon
  - type: MeleeWeapon
    damage:
      types:
        Slash: 12
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: MedievalWeaponDamage
    baseDamage:
      types:
        Slash: 12.0
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedPelt: 200

- type: entity
