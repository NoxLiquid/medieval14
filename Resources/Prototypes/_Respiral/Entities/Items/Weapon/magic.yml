# Магические мечи из адамантина и магических кристаллов.
# Крафтятся на наковальне (MedievalFireBladeRecipe/MedievalSpectralBladeRecipe в Recipe/recipe.yml),
# требуют полного мастерства (Mastery) кузнечного дела; также появляются как лут/спавн.

- type: entity
  parent: MedievalBaseSword
  id: MedievalFireBlade
  name: огненный клинок
  description: Меч из адамантина, напитанный магическими кристаллами. Его лезвие пылает вечным пламенем.
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Items/Weapon/fire_blade.rsi
    state: icon
    layers:
    - state: icon
  - type: MeleeWeapon
    damage:
      types:
        Slash: 23.99
        Heat: 12.01
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: MedievalWeaponDamage
    baseDamage:
      types:
        Slash: 13.71
        Heat: 6.86
  - type: PointLight
    color: "#E25822"
    radius: 2.5
    energy: 2.5
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Damageable
    damageModifierSet: MedievalAdamantine
  - type: Injurable
    damageContainer: MedievalInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedAdamantine: 200
      MedievalRawManaCrystal: 100

- type: entity
  parent: MedievalBaseSword
  id: MedievalSpectralBlade
  name: призрачный клинок
  description: Меч из адамантина, напитанный магическими кристаллами. От его лезвия веет могильным холодом.
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Items/Weapon/spectral_blade.rsi
    state: icon
    layers:
    - state: icon
  - type: MeleeWeapon
    damage:
      types:
        Slash: 23.99
        Cold: 12.01
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: MedievalWeaponDamage
    baseDamage:
      types:
        Slash: 13.71
        Cold: 6.86
  - type: PointLight
    color: "#47F8FF"
    radius: 2.5
    energy: 2.5
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Damageable
    damageModifierSet: MedievalAdamantine
  - type: Injurable
    damageContainer: MedievalInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedAdamantine: 200
      MedievalRawManaCrystal: 100
