- type: entity
  parent: MedievalBaseSpear
  id: MedievalIronSpear
  name: железное копьё
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Items/Weapon/two_spear.rsi
    layers:
    - state: blade
      color: "#8A8A8A"
      map: [ base ]
    - state: handle
      map: [ handle ]
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 3.33
        Slash: 3.34
        Piercing: 3.33
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 6.67
        Slash: 6.66
        Piercing: 6.67
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#8A8A8A"
      right:
      - state: inhand-right
        color: "#8A8A8A"
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedIron: 50
      MedievalProcessedWood: 200
  - type: AddWearAfterUse
    triggers: [MeleeHit, Interact]
    damage:
      types:
        Structural: 5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

