- type: entity
  parent: MedievalBaseSpear
  id: MedievalIronSpear
  name: железное копьё
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Items/Weapon/two_spear.rsi
    layers:
    - state: blade
      map: [ base ]
    - state: handle
      map: [ handle ]
  - type: MaterialColorVisuals
    layers:
      base: MedievalProcessedIron
    inhand: MedievalProcessedIron
  - type: MeleeWeapon
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 6.67
        Slash: 6.66
        Piercing: 6.67
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedIron: 50
      MedievalProcessedWood: 200
  - type: AddWearAfterUse
    triggers: [MeleeHit, Interact]
    damage:
      types:
        Structural: 5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

