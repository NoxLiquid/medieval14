- type: entity
  parent: MedievalBasePolearm
  id: MedievalIronPolearm
  name: железный полеарм
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Items/Weapon/two_polearm.rsi
    layers:
    - state: blade
      map: [ base ]
    - state: handle
      map: [ handle ]
  - type: MaterialColorVisuals
    layers:
      base: MedievalProcessedIron
    inhand: MedievalProcessedIron
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 3.17
        Slash: 3.16
        Piercing: 3.17
  - type: MedievalWeaponDamage
    baseDamage:
      types:
        Blunt: 3.17
        Slash: 3.16
        Piercing: 3.17
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 6.33
        Slash: 6.34
        Piercing: 6.33
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        scale: 0.5, 0.5
      right:
      - state: inhand-right
        scale: 0.5, 0.5
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedIron: 100
      MedievalProcessedWood: 200
  - type: AddWearAfterUse
    triggers: [MeleeHit, Interact]
    damage:
      types:
        Structural: 5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

