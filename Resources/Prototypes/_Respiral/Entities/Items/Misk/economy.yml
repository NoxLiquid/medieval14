# Кошелёк

- type: entity
  parent: BaseItem
  id: MedievalWallet
  name: кошелёк
  description: Кожаный мешочек для монет.
  components:
  - type: MedievalPhysicalPriced
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: InteractionOutline
  - type: Sprite
    sprite: _Respiral/Objects/Items/Economy/wallet.rsi
    state: wallet-0
  - type: Item
    size: Small
    sprite: _Respiral/Objects/Items/Economy/wallet.rsi
  - type: Storage
    maxItemSize: Tiny
    grid:
    - 0,0,5,2
    whitelist:
      tags:
        - MedievalCoin
  - type: Damageable
    damageContainer: MedievalInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:EmptyContainersBehaviour
        containers:
        - storagebase
  - type: ItemMapper
    mapLayers:
      wallet-0:
        whitelist:
          tags: [ MedievalCoin ]
        minCount: 0
      wallet-1:
        whitelist:
          tags: [ MedievalCoin ]
        minCount: 1
      wallet-2:
        whitelist:
          tags: [ MedievalCoin ]
        minCount: 4
      wallet-3:
        whitelist:
          tags: [ MedievalCoin ]
        minCount: 7
    sprite: _Respiral/Objects/Items/Economy/wallet.rsi
  - type: Appearance
