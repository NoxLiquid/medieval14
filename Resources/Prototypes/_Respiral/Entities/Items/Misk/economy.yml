# Монеты

- type: entity
  parent: BaseItem
  id: MedievalGoldCoin
  categories: [ HideSpawnMenu ]
  name: золотая монета
  description: Блестящая золотая монета.
  components:
  - type: MedievalPhysicalPriced
  - type: Sprite
    sprite: _Respiral/Objects/Items/Economy/gold_coin.rsi
    layers:
    - state: coin0
      map: ["base"]
  - type: Item
    size: Tiny
    sprite: _Respiral/Objects/Items/Economy/gold_coin.rsi
  - type: Stack
    stackType: MedievalGoldCoin
    baseLayer: base
    layerStates:
    - coin0
    - coin1
    - coin2
    - coin3
    - coin4
    - coin5
    - coin6
    - coin7
    - coin8
    - coin9
    - coin10
  - type: Tag
    tags:
    - MedievalCoin
    - MedievalGoldCoin
  - type: Appearance
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedGold: 10
  - type: Damageable
    damageContainer: MedievalInorganic
    damageModifierSet: MedievalIron
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: MedievalGoldCoin
  id: MedievalGoldCoin1
  components:
  - type: Stack
    count: 1

