- type: entity
  id: MedievalCarpetItemBase
  parent: BaseItem
  name: ковёр
  description: Свернутый тканый ковёр, готовый к укладке.
  abstract: true
  components:
  - type: Sprite
    sprite: _Respiral/Structures/Furniture/Carpets/icons.rsi
  - type: Item
    sprite: _Respiral/Structures/Furniture/Carpets/icons.rsi
    size: Normal
  - type: SpawnAfterInteract
    doAfter: 0.5
    removeOnInteract: true
  - type: Clickable
  - type: PhysicalComposition
    materialComposition:
      MedievalCloth: 100

- type: entity
  id: MedievalCarpetItemRed
  parent: MedievalCarpetItemBase
  name: красный ковёр
  components:
  - type: Sprite
    state: red
  - type: SpawnAfterInteract
    prototype: MedievalCarpetRed

