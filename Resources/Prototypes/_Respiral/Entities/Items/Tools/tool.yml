- type: entity
  name: лопата
  parent: BaseItem
  suffix: Средневековье
  id: MedievalShovel
  description: Большой инструмент для копания и перемещения грунта.
  components:
  - type: Sprite
    sprite: Objects/Tools/shovel.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 45
    damage:
      types:
        Blunt: 10
    soundHit:
      collection: MetalThud
  - type: Item
    size: Normal
    sprite: Objects/Tools/shovel.rsi
  - type: Shovel
  - type: Tool
    qualities:
      - MedievalDigging
    useSound:
      path: /Audio/Items/shovel_dig.ogg
  - type: ToolTileCompatible
  - type: Wear
  - type: AddWearAfterUse
    triggers: [TileTool, MeleeHit]
    damage:
      types:
        Structural: 10
  - type: Damageable
    damageModifierSet: MedievalIron
  - type: Injurable
    damageContainer: MedievalInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  name: кирка
  parent: BaseItem
  id: MedievalPickaxe
  suffix: Средневековье
  description: Идеально выточенный, чтобы забивать его в камни.
  components:
  - type: Tag
    tags:
    - Pickaxe
  - type: Sprite
    sprite: Objects/Weapons/Melee/pickaxe.rsi
    state: pickaxe
  - type: MeleeWeapon
    attackRate: 0.7
    wideAnimationRotation: -135
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
      params:
        volume: -3
    damage:
      types:
        Blunt: 1.67
        Slash: 1.66
        Piercing: 1.67
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 3.33
        Slash: 3.34
        Piercing: 3.33
        Structural: 10
  - type: Item
    size: Normal
    shape:
    - 0,0,2,0
    - 1,1,1,2
    sprite: Objects/Weapons/Melee/pickaxe.rsi
    storedRotation: -45
  - type: UseDelay
  - type: Tool
    qualities:
      - MedievalSwotting
    useSound:
      path: /Audio/Items/shovel_dig.ogg
  - type: ToolTileCompatible

- type: entity
  id: MedievalPliers
  parent: BaseItem
  name: клещи
  suffix: Средневековье
  description: Кузнечные клещи для удержания раскалённого металла.
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Items/Tools/pliers.rsi
    state: icon
  - type: Item
    size: Small

- type: entity
  id: MedievalBellows
  parent: BaseItem
  name: кузнечные меха
  suffix: Средневековье
  description: Меха для нагнетания воздуха в кузнечный горн.
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Items/Tools/bellows.rsi
    state: icon
  - type: Item
    size: Normal

- type: entity
  id: MedievalHammer
  parent: BaseItem
  name: строительный молот
  suffix: Средневековье
  description: Инструмент установки различных конструкций и приспособлений.
  components:
  - type: MedievalPhysicalPriced
  - type: Sprite
    sprite: _Respiral/Objects/Items/Tools/hammer.rsi
    state: hammer2
  - type: Item
    size: Normal
    heldPrefix: hammer2
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 7
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedIron: 100
      MedievalProcessedWood: 100
  - type: Wear
  - type: Damageable
    damageModifierSet: MedievalIron
  - type: Injurable
    damageContainer: MedievalInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: AddWearAfterUse
    triggers: [MeleeHit, Tool]
    damage:
      types:
        Structural: 5
  - type: Tool
    qualities:
      - MedievalScore
    useSound:
      path: /Audio/_Respiral/Hammer/sound_effects_hit_punch.ogg
  - type: NeededSkillForInteractUsing
    neededSkillsProgress:
      MedievalEngineering: 1
