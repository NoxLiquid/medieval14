- type: entity
  name: подсвечник
  parent: BaseItem
  id: MedievalCandelabraBase
  abstract: true
  components:
  - type: MedievalPhysicalPriced
  - type: Tag
    tags:
    - Candle
  - type: Item
    size: Large
  - type: Appearance
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
  - type: ExtinguishOnInteract
    extinguishAttemptSound:
      path: /Audio/Items/candle_blowing.ogg
      params:
        variation: 0.05
        volume: 10
  - type: UseDelay
  - type: ExtinguishableSetCollisionWake
  - type: Flammable
    fireSpread: false
    canResistFire: false
    alwaysCombustible: true
    canExtinguish: true
    firestacksOnIgnite: 3.0
    firestackFade: -0.01
    damage:
      types:
        Heat: 0.1
  - type: PointLight
    enabled: false
    netsync: false
    color: "#F5C16C"
    radius: 2.1
    energy: 1.8
  - type: ItemTogglePointLight
  - type: ToggleableVisuals
    spriteLayer: flame
  - type: Damageable
    damageModifierSet: MedievalIron
  - type: Injurable
    damageContainer: MedievalInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedIron: 50
      MedievalProcessedWood: 50

- type: entity
  parent: MedievalCandelabraBase
  id: MedievalIronCandelabra1
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Items/Light/candles.rsi
    layers:
    - state: candelabra_metal_1
      map: ["candelabra_metal_1"]
    - state: candle1
    - state: candelabra1_on
      shader: unshaded
      visible: false
      map: [ "flame" ]
  - type: MaterialColorVisuals
    layers:
      candelabra_metal_1: MedievalProcessedIron
    inhand: MedievalProcessedIron
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedIron: 50
      MedievalProcessedWood: 50
      MedievalRawCoal: 25

