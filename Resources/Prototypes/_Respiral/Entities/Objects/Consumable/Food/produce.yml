- type: entity
  name: тройника
  parent: FoodProduceBase
  id: MedievalFoodBerriesTroynika
  description: Три красные ягодки, соединённые общим хвостиком
  components:
  - type: FlavorProfile
    flavors:
      - berry
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 11
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Vitamin
          Quantity: 4
  - type: Sprite
    sprite: _Respiral/Objects/Specific/Produce/troynika.rsi
    state: berry
  - type: Item
    size: Tiny
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: JuiceBerry
        Quantity: 10
  - type: Tag
    tags:
    - Fruit


