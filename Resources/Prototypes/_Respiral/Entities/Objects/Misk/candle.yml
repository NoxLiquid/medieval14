- type: entity
  name: candle
  parent: BaseItem
  id: BaseCandelabra
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Misc/candles.rsi
  - type: Item
    size: Large
  - type: PointLight
    enabled: false
    color: "#E25822"
    radius: 1.0
    energy: 5.0
  - type: LightBehaviour
    behaviours:
      - !type:RandomizeBehaviour
        id: turn_on
        interpolate: Nearest
        minDuration: 0.02
        maxDuration: 0.06
        startValue: 6.0
        endValue: 9.0
        property: Energy
        isLooped: true
      - !type:FadeBehaviour
        id: turn_on
        maxDuration: 8.0
        startValue: 1.0
        endValue: 6.0
      - !type:RandomizeBehaviour
        id: fade_out
        interpolate: Nearest
        minDuration: 0.02
        maxDuration: 0.06
        startValue: 4.0
        endValue: 8.0
        property: Energy
        isLooped: true
      - !type:FadeBehaviour
        id: fade_out
        maxDuration: 4.0
        startValue: 6.0
        endValue: 1.0
  - type: IgnitionSource
    ignited: false
    temperature: 400.0
  - type: Appearance
  - type: BurnStateVisuals
    unlitIcon: match_unlit
    litIcon: match_lit
    burntIcon: match_burnt

- type: entity
  name: candle
  parent: BaseCandelabra
  id: Candelabra1
  components:
    - type: Sprite
      sprite: _Respiral/Objects/Misc/candles.rsi
      layers:
        - map: [ enum.ExpendableLightVisualLayers.Base ]
          state: candelabra1_on
        - map: [ enum.ExpendableLightVisualLayers.Glow ]
          state: candelabra1_off
          visible: false
      
