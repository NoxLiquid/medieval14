  suffix: Средневековье, Single
  components:
  - type: Stack
    count: 1
  - type: PhysicalComposition
    materialComposition:
      MedievalCloth: 3

- type: entity
  parent: BaseHealingItem
  id: MedievalBrutepack
  name: бинт для ушибов
  description: Тонкая ткань, пропитанная травами для лечения ушибов. Слишком хрупкая, чтобы останавливать кровотечение.
  suffix: Средневековье, Full
  components:
  - type: MedievalPhysicalPriced
  - type: Sprite
    sprite: _Respiral/Objects/Specific/Medical/bandage.rsi
    state: herbbandage_3
    layers:
    - state: herbbandage_3
      map: [ "base" ]
  - type: Item
    sprite: _Respiral/Objects/Specific/Medical/bandage.rsi
    heldPrefix: herbbandage
  - type: Healing
    damageContainers:
    - Biological
    - MedievalBiological
    damage:
      types:
        Blunt: -8
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
  - type: Stack
    stackType: MedievalBrutepack
    count: 10
    baseLayer: base
    layerStates:
    - herbbandage
    - herbbandage_2
    - herbbandage_3
  - type: PhysicalComposition
    materialComposition:
      MedievalCloth: 30

- type: entity
  parent: MedievalBrutepack
  id: MedievalBrutepack1
  suffix: Средневековье, Single
  components:
  - type: Sprite
    state: herbbandage
  - type: Stack
    count: 1
  - type: PhysicalComposition
    materialComposition:
      MedievalCloth: 3

- type: entity
  parent: BaseSyringe
  id: MedievalSyringe
  name: шприц
  description: Стеклянный шприц с иглой — набрать раствор или ввести его в рану.
  suffix: Средневековье
  components:
  - type: MedievalPhysicalPriced
  - type: Sprite
    sprite: _Respiral/Objects/Specific/Chemistry/syringe.rsi
    layers:
    - state: syringe1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
    - state: base
      map: [ "enum.SolutionContainerLayers.Base" ]
  - type: Icon
    sprite: _Respiral/Objects/Specific/Chemistry/syringe.rsi
    state: base
  - type: Item
    size: Tiny
    sprite: _Respiral/Objects/Specific/Chemistry/syringe.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: syringe
    inHandsMaxFillLevels: 0
    inHandsFillBaseName: null
  - type: PhysicalComposition
    materialComposition:
      MedievalGlass: 30
