- type: entity
  parent: BaseItem
  id: MedievalBandage
  name: бинт
  description: Плотная тканевая повязка, останавливающая кровотечение и стягивающая мелкие раны.
  suffix: Средневековье, 5
  components:
  - type: MedievalPhysicalPriced
  - type: Item
    size: Small
    sprite: _Respiral/Objects/Specific/Medical/bandage.rsi
    heldPrefix: bandage
  - type: Sprite
    sprite: _Respiral/Objects/Specific/Medical/bandage.rsi
    state: bandage_3
    layers:
    - state: bandage_3
      map: [ "base" ]
  - type: Healing
    damageContainers:
    - Biological
    - MedievalBiological
    damage:
      types:
        Slash: -6
        Piercing: -6
    bloodlossModifier: -10
    delay: 2
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
  - type: Stack
    stackType: MedievalBandage
    count: 5
    baseLayer: base
    layerStates:
    - bandage
    - bandage_2
    - bandage_3
  - type: PhysicalComposition
    materialComposition:
      MedievalCloth: 50

- type: entity
  parent: MedievalBandage
  id: MedievalBandage1
  suffix: Средневековье, 1
  components:
  - type: Sprite
    state: bandage
  - type: Stack
    count: 1
  - type: PhysicalComposition
    materialComposition:
      MedievalCloth: 10

- type: entity
