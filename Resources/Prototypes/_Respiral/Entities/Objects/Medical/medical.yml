  - type: Healing
    damageContainers:
    - Biological
    - MedievalBiological
    damage:
      types:
        Heat: -5
        Cold: -5
    healingBeginSound:
      path: "/Audio/Items/Medical/ointment_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/ointment_end.ogg"
  - type: Stack
    stackType: MedievalOintment
    count: 10
  - type: PhysicalComposition
    materialComposition:
      MedievalCloth: 30

- type: entity
  parent: MedievalOintment
