- type: entity
  id: BaseBush
  name: куст
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Appearance
  - type: SpeedModifierContacts
    affectAirborne: true
    walkSpeedModifier: 0.4
    sprintSpeedModifier: 0.4
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        density: 7
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - MidImpassable



- type: entity # Большой куст без ягод
  parent: BaseBush
  id: BushBig
  name: куст
  description: Большой куст.
  suffix: Большой, Без ягод
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Flora/Bushes/Big/big_bush.rsi
    layers:
    - state: big_bush01
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        big_bush01: ""
        big_bush02: ""
        big_bush03: ""
        big_bush04: ""
        big_bush05: ""


- type: entity # Большая Тройника
  parent: BaseBush
  id: BushBigTroynika
  description: Большой куст. На нём время от времени вырастают красные плоды, веточки которых соединяют три ягоды вместе.
  suffix: Большой, Тройника
  components:
  - type: Sprite
    sprite: _Respiral/Objects/Flora/Bushes/Big/big_troynika.rsi
    layers:
    - state: big_troynika_b
      map: ["flora"]
  - type: Flora
    harvestPrototype: FoodBerriesTroynika
    maxYield: 5
    minYield: 3
    growthWindow:
      min: 10m
      max: 20m # От 10 до 20 минут
    harvestDuration: 25
  - type: GenericVisualizer
    visuals:
      enum.FloraVisuals.State:
        flora:
          Grown: { state: big_troynika_b }
          Harvested: { state: big_troynika_h }

