- type: entity
  abstract: true
  parent: DrinkBaseCup
  id: MedievalDrinkBaseWoodenCup
  components:
  - type: Damageable
    damageContainer: MedievalInorganic
    damageModifierSet: MedievalWood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpillBehavior { }
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedWood: 25

- type: entity
  abstract: true
  parent: DrinkBaseCup
  id: MedievalDrinkBaseIconFillCup
  components:
  - type: Appearance
  - type: Sprite
    layers:
    - state: icon-0
      map: ["enum.SolutionContainerLayers.Base"]
    - state: icon-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: icon-
    inHandsFillBaseName: null

- type: entity
  abstract: true
  parent: [MedievalDrinkBaseWoodenCup, MedievalDrinkBaseIconFillCup]
  id: MedievalDrinkBaseWoodenBeerMug
  name: деревянная кружка
