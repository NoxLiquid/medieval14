    sprite: _Respiral/Objects/Drinks/goblet.rsi
    layers:
    - state: iron_goblet
    - state: fill-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: fill-
    inHandsFillBaseName: null

- type: entity
  abstract: true
  parent: [DrinkBaseMaterialGlass, DrinkBase, DrinkBaseOpenable, DrinkVisualsAll]
  id: MedievalDrinkBaseBottle
  name: бутылка
  description: Стеклянная бутылка для напитков.
  components:
  - type: Item
    size: Small
  - type: Openable
    sound:
      collection: bottleOpenSounds
    closeable: true
    closeSound:
      collection: bottleCloseSounds
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 50
  - type: FitsInDispenser
    solution: drink
  - type: Tool
    qualities:
    - Rolling
    speedModifier: 0.75
  - type: Tag
    tags:
    - DrinkBottle
  - type: PhysicalComposition
    materialComposition:
      MedievalGlass: 25
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpillBehavior { }
      - !type:SpawnEntitiesBehavior
        spawn:
          BrokenBottle:
            min: 1
            max: 1
        transferForensics: true
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

