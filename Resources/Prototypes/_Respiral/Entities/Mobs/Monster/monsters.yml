# === Костяной пёс ===
- type: entity
  parent: MedievalMonsterMobBase
  id: MobMedievalBoneHound
  name: костяной пёс
  description: Нежить, собранная из костей. Быстрая и агрессивная.
  components:
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 0
  - type: Sprite
    drawdepth: Mobs
    sprite: _Respiral/Mobs/Monster/bone_hound.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: alive
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 6
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      groups:
        Brute: 8
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 60
        mask:
        - MobMask
        layer:
        - MobLayer

