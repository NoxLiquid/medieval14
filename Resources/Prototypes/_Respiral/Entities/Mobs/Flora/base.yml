- type: entity
  parent:
  - MobRespirator
  - MobAtmosStandard
  - BaseSimpleMob
  - MobAtmosExposed
  - MobCombat
  - MobBloodstream
  - MobFlammable
  - BaseMobAnimal
  id: MedievalFloraMobBase
  suffix: ИИ
  abstract: true
  components:
  - type: Damageable
    damageModifierSet: MobFlora
  - type: Injurable
    damageContainer: MedievalBiological
  - type: Satiation # Respiral: upstream merged Hunger/Thirst into Satiation (custom thresholds dropped, re-tune via satiation prototypes if needed)
    satiations:
      Hunger:
        prototype: NormalSatiationHunger
      Thirst:
        prototype: NormalSatiationThirst
  - type: StatusEffects
    allowed:
    - Electrocution
    - TemporaryBlindness
    - Pacified
    - Flashed
    - RadiationProtection
    - Adrenaline
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 200
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: MobPrice
    price: 500
  - type: FloatingVisuals
