- type: entity
  name: крыса
  id: MedievalMobRat
  parent: [ MedievalFloraMobBase, BaseMobRat ]
  description: Эта крыса выглядит грязной и больной, с её лохматой шерстью и красными глазами. Она может быть агрессивной, если к ней подойти, и не стоит недооценивать её опасность.
  components:
  - type: Item
    size: Tiny
    heldPrefix: 0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 20
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      25: Critical
      50: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed : 4
    baseSprintSpeed : 4
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
  - type: Sprite
    drawdepth: Mobs
    sprite: _Respiral/Mobs/Flora/rat.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      color: '#dddddd'
      state: alive
  - type: ReplacementAccent
    accent: mouse
  - type: Speech
    speechSounds: Squeak
    speechVerb: SmallMob
    allowedEmotes: ['Squeak']
  - type: Vocal
    emoteSounds: Mouse
    wilhelmProbability: 0.001
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 3
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 20
  - type: MobPrice
    price: 50
  - type: BadFood
  - type: Extractable
    grindableSolutionName: food
  - type: Satiation # Respiral: upstream merged Hunger/Thirst into Satiation
    satiations:
      Hunger:
        prototype: NormalSatiationHunger
      Thirst:
        prototype: NormalSatiationThirst
  - type: Edible
  - type: FlavorProfile
    flavors:
    - meaty
  - type: NpcFactionMember
    factions:
    - MedievalWolf
  - type: HTN
    rootTask:
      task: MedievalHostileFloraCompound

