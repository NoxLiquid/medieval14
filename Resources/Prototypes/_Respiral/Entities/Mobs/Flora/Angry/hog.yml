- type: entity
  name: кабан
  description: Этот кабан выглядит довольно угрожающе, с его массивным телом и острыми клыками. Он может быть агрессивным, если к нему подойти, и не стоит недооценивать его опасность.
  parent: MedievalFloraMobBase
  id: MedievalMobHog
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Respiral/Mobs/Flora/hog.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      color: '#2B2B2B'
      state: running
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 250
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Tag
    tags:
    - DoorBumpOpener
    - Pig
  - type: Butcherable
    spawned:
    - id: MedievalRawPelt
      amount: 2
  - type: Grammar
    attributes:
      gender: epicene
  - type: InteractionPopup
    successChance: 0.7
    interactSuccessString: petting-success-pig
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/pig_oink.ogg
  - type: ReplacementAccent
    accent: pig
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-organic
  - type: NpcFactionMember
    factions:
    - MedievalHog
  - type: HTN
    rootTask:
      task: MedievalHostileFloraCompound
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcFist
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
    damage:
      groups:
        Brute: 15

- type: entity
  parent: MedievalMobHog
  id: MedievalMobHog2
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Respiral/Mobs/Flora/hog.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      color: '#4A3B2A'
      state: running
