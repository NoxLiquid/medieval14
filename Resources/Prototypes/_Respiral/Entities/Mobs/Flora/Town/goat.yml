- type: entity
  name: коза
  parent: MedievalBaseHerbivore
  id: MedievalMobGoat
  description: Эта коза известна своей упрямостью и способностью лазать по самым крутым поверхностям. Она может быть дружелюбной, если к ней подойти с правильным настроем, но не стоит недооценивать её способность внезапно начать блеять и убегать от вас.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: goat
      sprite: Mobs/Animals/goat.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 150
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Tag
    tags:
    - ClothMade
    - DoorBumpOpener
    - MedievalGoat
  - type: Reproductive
    partnerWhitelist:
      tags:
      - MedievalGoat
    offspring:
    - id: MedievalMobGoat
  - type: ReproductivePartner
  - type: Appearance
  - type: DamageStateVisuals
    states:
      Alive:
        Base: goat
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: SolutionManager
    solutions:
    - MedievalSolutionUdderGoat
    - MedievalSolutionWoolGoat
  - type: Udder
    reagentId: MilkGoat
    quantityPerUpdate: 25
    growthDelay: 20
  - type: ExaminableHunger
  - type: Wooly
  - type: Edible
    destroyOnEmpty: false
    solution: wool
    requiresSpecialDigestion: true
    requireDead: false
  - type: FlavorProfile
    flavors:
    - fiber
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 4
  - type: Grammar
    attributes:
      gender: female # Here because of UdderComponent
  - type: Speech
    speechSounds: Goat
    speechVerb: Goat
  - type: Vocal
    emoteSounds: Goat
  - type: BleatingAccent
  - type: InteractionPopup
    successChance: 0.2
    interactSuccessString: petting-success-goat
    interactFailureString: petting-failure-goat
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/goat_bah.ogg
  - type: NpcFactionMember
    factions:
    - Passive
  - type: NPCRetaliation
    attackMemoryLength: 5
  - type: FactionException
  - type: HTN
    rootTask:
      task: RuminantHostileCompound

- type: entity
  parent: SolutionLarge
  id: MedievalSolutionUdderGoat
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: udder
    solution:
      maxVol: 250
      reagents:
      - ReagentId: MilkGoat
        Quantity: 30

- type: entity
  parent: SolutionLarge
  id: MedievalSolutionWoolGoat
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: wool
    solution:
      maxVol: 250
