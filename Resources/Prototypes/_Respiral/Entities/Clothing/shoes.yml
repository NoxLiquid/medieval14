# Medieval shoes-slot clothing prototypes generated from _Respiral/Clothing/Shoes/*.rsi

- type: entity
  parent: MedievalBaseShoes
  id: MedievalClothingShoesBoots
  suffix: Средневековье
  name: сапоги
  components:
  - type: Sprite
    sprite: _Respiral/Clothing/Shoes/boots.rsi
    state: icon
  - type: Clothing
    sprite: _Respiral/Clothing/Shoes/boots.rsi
    clothingVisuals:
      shoes-Female:
      - state: equipped-FEET-female
  - type: Damageable
    damageModifierSet: MedievalPelt
  - type: Injurable
    damageContainer: MedievalClothing
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.98
        Slash: 0.98
        Piercing: 0.98
        Heat: 0.98
        Structural: 1
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedPelt: 100

