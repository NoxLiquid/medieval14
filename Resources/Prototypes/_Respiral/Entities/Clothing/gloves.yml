# Medieval gloves-slot clothing prototypes generated from _Respiral/Clothing/Hands/*.rsi

- type: entity
  parent: [ MedievalBaseGloves, MedievalArmorClothOther ]
  id: MedievalClothingHandsSmithGloves
  suffix: Средневековье
  name: перчатки ремесленника
  components:
  - type: Sprite
    sprite: _Respiral/Clothing/Hands/smith.rsi
    state: icon
  - type: Clothing
    sprite: _Respiral/Clothing/Hands/smith.rsi
  - type: Damageable
    damageModifierSet: MedievalPelt
  - type: Injurable
    damageContainer: MedievalClothing
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedPelt: 100

- type: entity
  parent: [ MedievalBaseGloves, MedievalArmorSteelHeadOrLegs ]
  id: MedievalClothingHandsHeavyArmored
  suffix: Средневековье
  name: тяжёлые бронированные перчатки
  components:
  - type: Sprite
    sprite: _Respiral/Clothing/Hands/heavy_armored.rsi
    state: icon
  - type: Clothing
    sprite: _Respiral/Clothing/Hands/heavy_armored.rsi
  - type: Damageable
    damageModifierSet: MedievalSteel
  - type: Injurable
    damageContainer: MedievalClothing
  - type: PhysicalComposition
    materialComposition:
      MedievalSteel: 100
