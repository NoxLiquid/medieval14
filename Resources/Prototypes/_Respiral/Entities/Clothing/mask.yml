# Medieval mask-slot clothing prototypes generated from _Respiral/Clothing/Mask/*.rsi

- type: entity
  parent: [ MedievalBaseMask, MedievalArmorMaterial ]
  id: MedievalClothingMaskExecutioner
  suffix: Средневековье
  name: колпак палача
  components:
  - type: Sprite
    sprite: _Respiral/Clothing/Mask/executioner.rsi
    state: icon
  - type: Clothing
    sprite: _Respiral/Clothing/Mask/executioner.rsi
  # Respiral - колпак палача полностью скрывает лицо: окружающие не узнают носителя в лицо
  - type: IdentityBlocker
    coverage: FULL
  - type: Item
    inhandVisuals:
      left: []
      right: []
  - type: Damageable
    damageModifierSet: MedievalFlax
  - type: Injurable
    damageContainer: MedievalClothing
  - type: PhysicalComposition
    materialComposition:
      MedievalCloth: 100

