# Medieval belt-slot clothing prototypes generated from _Respiral/Clothing/Belt/*.rsi

- type: entity
  parent: MedievalBaseBelt
  id: MedievalClothingBeltChain
  suffix: Средневековье
  name: цепной пояс
  components:
  - type: Sprite
    sprite: _Respiral/Clothing/Belt/chain.rsi
    state: icon
  - type: Clothing
    sprite: _Respiral/Clothing/Belt/chain.rsi
  - type: Damageable
    damageContainer: MedievalClothing
    damageModifierSet: MedievalIron
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.98
        Slash: 0.98
        Piercing: 0.98
        Heat: 0.98
        Structural: 1
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedIron: 100

