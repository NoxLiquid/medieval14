- type: entity
  abstract: true
  parent: BaseItem
  id: MedievalBaseClothing
  suffix: Средневековье
  components:
  - type: MedievalPhysicalPriced
  - type: Item
    size: Normal
  - type: Sprite
  - type: FlavorProfile
    flavors:
    - fiber
  - type: Wear
  - type: Damageable
    damageContainer: MedievalClothing
    damageModifierSet: MedievalFlax
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# === BASE INNER CLOTHING ===
- type: entity
  parent: MedievalBaseClothing
  id: MedievalBaseInnerClothing
  abstract: true
  name: рубаха
  components:
  - type: MedievalPhysicalPriced
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Clothing
    slots: [innerclothing]
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING

