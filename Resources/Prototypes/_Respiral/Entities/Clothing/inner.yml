# Medieval inner clothing generated from _Respiral/Clothing/Uniforms/Jumpsuit/*.rsi

- type: entity
  parent: MedievalBaseInnerClothing
  id: MedievalClothingInnerLongTunic
  suffix: Средневековье
  name: длинная туника
  components:
  - type: Sprite
    sprite: _Respiral/Clothing/Uniforms/Jumpsuit/long_shirt.rsi
    state: icon
  - type: Clothing
    sprite: _Respiral/Clothing/Uniforms/Jumpsuit/long_shirt.rsi
  - type: Damageable
    damageModifierSet: MedievalFlax
  - type: Injurable
    damageContainer: MedievalClothing
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.96
        Structural: 1
  - type: PhysicalComposition
    materialComposition:
      MedievalCloth: 100
