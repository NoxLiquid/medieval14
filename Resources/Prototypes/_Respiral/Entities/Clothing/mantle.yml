# Neck mantles. One grayscale RSI (mantle.rsi) split into 3 tintable layers:
# body (recolored per variant) + fur trim + gold trim (both fixed across variants).

- type: entity
  parent: [ MedievalBaseNeck, MedievalArmorMaterial ]
  id: MedievalClothingNeckMantleCrimson
  suffix: Средневековье
  name: багряная мантия
  description: Богатая мантия с меховой опушкой и золотой отделкой.
  components:
  - type: Sprite
    sprite: _Respiral/Clothing/Neck/Mantles/mantle.rsi
    layers:
    - state: icon-body
      color: "#7A2E2E"
    - state: icon-trim
      color: "#EDE7DC"
    - state: icon-gold
      color: "#C9A24B"
  - type: Item
    inhandVisuals:
      left: []
      right: []
  - type: Clothing
    sprite: _Respiral/Clothing/Neck/Mantles/mantle.rsi
    clothingVisuals:
      neck:
      - state: equipped-NECK-body
        color: "#7A2E2E"
      - state: equipped-NECK-trim
        color: "#EDE7DC"
      - state: equipped-NECK-gold
        color: "#C9A24B"
  - type: Damageable
    damageModifierSet: MedievalFlax
  - type: Injurable
    damageContainer: MedievalClothing
  - type: PhysicalComposition
    materialComposition:
      MedievalCloth: 100

