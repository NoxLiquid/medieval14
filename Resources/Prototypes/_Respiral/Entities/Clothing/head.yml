# Medieval head-slot clothing prototypes generated from _Respiral/Clothing/Head/**/*.rsi

- type: entity
  parent: [ MedievalBaseHead, MedievalArmorGoldHeadFeet ]
  id: MedievalClothingHeadCrown
  suffix: Средневековье
  name: корона
  components:
  - type: Sprite
    sprite: _Respiral/Clothing/Head/Hats/crown.rsi
    state: icon
  - type: Clothing
    sprite: _Respiral/Clothing/Head/Hats/crown.rsi
  - type: Damageable
    damageModifierSet: MedievalGold
  - type: Injurable
    damageContainer: MedievalClothing
  - type: PhysicalComposition
    materialComposition:
      MedievalProcessedGold: 100

