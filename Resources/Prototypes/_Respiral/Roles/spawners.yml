# Спавнеры средневековых профессий: создают гуманоида с стартовым снаряжением профессии.
# По образцу Entities/Mobs/Player/humanoid.yml (RandomHumanoidSpawner + randomHumanoidSettings + Loadout).
# Loadout.prototypes ссылается на startingGear из _Respiral/Roles/Jobs/*.

- type: entity
  abstract: true
  id: MedievalBaseHumanoidSpawner
  components:
  - type: Sprite
    sprite: Markers/jobs.rsi
    state: green

# === Знать (Nobles) ===

- type: entity
  parent: MedievalBaseHumanoidSpawner
  id: MedievalRandomHumanoidSpawnerLord
  name: барон
  suffix: Спавнер, Средневековье
  components:
  - type: RandomHumanoidSpawner
    settings: MedievalLord

- type: randomHumanoidSettings
  id: MedievalLord
  components:
  - type: RandomHumanoidAppearance
  - type: Loadout
    prototypes: [ MedievalLordGearNPC ]

