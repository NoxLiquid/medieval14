# ZLevels actions (ported from CrystallEdge _CE). Icons via Action.icon/iconOn
# (this fork's engine has no enum.ActionVisuals sprite-layer maps yet).
- type: entity
  id: CEActionZLevelUp
  name: Move up
  description: Move up one Z-Level
  components:
  - type: Action
    checkCanInteract: false
    icon: { sprite: _CE/Actions/misc.rsi, state: up }
  - type: InstantAction
    event: !type:CEZLevelActionUp

- type: entity
  id: CEActionZLevelDown
  name: Move down
  description: Move down one Z-Level
  components:
  - type: Action
    checkCanInteract: false
    icon: { sprite: _CE/Actions/misc.rsi, state: down }
  - type: InstantAction
    event: !type:CEZLevelActionDown

- type: entity
  parent: BaseToggleAction
  id: CEActionToggleLookUp
  name: Look up
  description: You lift your head and look up at the sky.
  components:
  - type: Action
    checkCanInteract: false
    icon: { sprite: _CE/Actions/misc.rsi, state: eye_down }
    iconOn: { sprite: _CE/Actions/misc.rsi, state: eye_up }
